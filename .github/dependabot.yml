# Weekly pull requests for new versions of the PHP base image, the Composer packages and the workflow's actions
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      symfony:
        patterns: ["symfony/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
