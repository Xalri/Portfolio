# Builds the image at each push to main, pushes it to GitHub's registry, then has Portainer redeploy the
# Kubernetes stack (k8s/production.yaml). The webhook URL is the repository secret PORTAINER_K8S_WEBHOOK;
# each image is also tagged with its commit, to go back to it.
# Then tells Keel the image was pushed (secret KEEL_WEBHOOK_URL), so it restarts the app on it: the manifest
# names the same tag, so applying it alone restarts nothing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push portfolio
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xalri/portfolio:main
            ghcr.io/xalri/portfolio:${{ github.sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

      - name: Redeploy the Kubernetes stack
        env:
          WEBHOOK: ${{ secrets.PORTAINER_K8S_WEBHOOK }}
        run: |
          # Skipped until the secret is set: the image is pushed, nothing is redeployed
          if [ -z "$WEBHOOK" ]; then
            echo "No webhook secret, nothing redeployed"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"

      - name: Tell Keel the image was pushed
        env:
          KEEL: ${{ secrets.KEEL_WEBHOOK_URL }}
        run: |
          # Skipped until the secret is set: the app keeps running its previous image
          if [ -z "$KEEL" ]; then
            echo "No Keel webhook secret, nothing restarted"
            exit 0
          fi
          curl -fsS -X POST "$KEEL" -H "Content-Type: application/json" \
            -d '{"name": "ghcr.io/xalri/portfolio", "tag": "main"}'
