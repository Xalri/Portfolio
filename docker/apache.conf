# Served from public/ only: the code, content and vendor/ next to it stay out of reach
<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # Everything the pages load: Google Fonts, Umami and Google Analytics. Styles stay open to inline ones,
    # which script.js and js/projects.js set on elements.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://unami.xalri.ovh https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://unami.xalri.ovh https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    # CSS and JS are linked with ?v=<hash of the file>, so a change gets a new URL
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType text/javascript "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType image/x-icon "access plus 30 days"
</IfModule>
