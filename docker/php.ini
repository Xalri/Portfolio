; Errors go to the container's log, never to visitors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off

; Mitigation of PHP2Shell (CVE-2026-109618), as on the cluster's other PHP sites
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.validate_timestamps = 0
