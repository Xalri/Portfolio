# The portfolio on k3s, deployed by Portainer from this file and redeployed by .github/workflows/deploy.yml
# after each push. The image comes from ghcr.io (pull secret ghcr); the settings are the namespace's secret
# website-env, made in the cluster, never in this repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: portfolio
  labels:
    app: website
  # Restarted by Keel when the workflow says its image was pushed again
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      # On vps-ovh: the images are built for amd64
      nodeSelector:
        kubernetes.io/hostname: vps-ovh
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: website
          image: ghcr.io/xalri/portfolio:main
          imagePullPolicy: Always
          # MAILER_DSN (and optionally MAIL_FROM, MAIL_TO) for the contact form, made in the cluster; without it
          # the site runs and the form answers that sending failed
          envFrom:
            - secretRef:
                name: website-env
                optional: true
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: portfolio
spec:
  type: NodePort
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30099
